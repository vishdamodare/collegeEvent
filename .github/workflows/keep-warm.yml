# Pings the homepage so the Vercel function and Neon compute (suspends after ~5 min idle) stay warm.
# Peak hours only: Neon Free = 100 CU-hours/month (~400 h at 0.25 CU); 24/7 would exhaust it mid-month
# and suspend the DB until the next cycle. 07:00-16:55 UTC = 12:30-22:25 IST, ~310 h/month.
# ponytail: GitHub may delay scheduled runs under load; a paid Neon plan with suspend disabled is the real fix.
name: keep-warm

on:
  schedule:
    - cron: "*/5 7-16 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 30 https://collegeevent.in/
